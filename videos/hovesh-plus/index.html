<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #111114;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="32"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-pain"
        class="scene"
        data-composition-id="02-pain"
        data-composition-src="compositions/frames/02-pain.html"
        data-start="4"
        data-duration="4.4"
        data-track-index="1"
      ></div>

      <div
        id="el-03-product-intro"
        class="scene"
        data-composition-id="03-product-intro"
        data-composition-src="compositions/frames/03-product-intro.html"
        data-start="8"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-feature-rhythm"
        class="scene"
        data-composition-id="04-feature-rhythm"
        data-composition-src="compositions/frames/04-feature-rhythm.html"
        data-start="13"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-feature-tools"
        class="scene"
        data-composition-id="05-feature-tools"
        data-composition-src="compositions/frames/05-feature-tools.html"
        data-start="18"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-benefit-offline"
        class="scene"
        data-composition-id="06-benefit-offline"
        data-composition-src="compositions/frames/06-benefit-offline.html"
        data-start="23"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <div
        id="el-07-cta"
        class="scene"
        data-composition-id="07-cta"
        data-composition-src="compositions/frames/07-cta.html"
        data-start="27"
        data-duration="5"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.fromTo("#el-02-pain", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.to("#el-02-pain", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 8);
        tl.fromTo("#el-03-product-intro", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 8);
        tl.to("#el-03-product-intro", { y: -1920, duration: 0.5, ease: "power3.inOut" }, 13);
        tl.fromTo("#el-04-feature-rhythm", { y: 1920, opacity: 1 }, { y: 0, duration: 0.5, ease: "power3.inOut" }, 13);
        tl.to("#el-04-feature-rhythm", { y: -1920, duration: 0.5, ease: "power3.inOut" }, 18);
        tl.fromTo("#el-05-feature-tools", { y: 1920, opacity: 1 }, { y: 0, duration: 0.5, ease: "power3.inOut" }, 18);
        tl.to("#el-05-feature-tools", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 23);
        tl.fromTo("#el-06-benefit-offline", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 23);
        tl.to("#el-06-benefit-offline", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 27);
        tl.fromTo("#el-07-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 27);
        tl.to({}, { duration: 32 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
