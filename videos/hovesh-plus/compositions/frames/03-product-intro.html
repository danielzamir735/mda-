  <script>
    (function () {
      var root = document.currentScript.closest("template") || document.currentScript.parentNode;
      var scope = (document.currentScript.getRootNode && document.currentScript.getRootNode()) || document;

      var captionEl = scope.getElementById
        ? scope.getElementById("hf03-caption")
        : document.getElementById("hf03-caption");

      // Build the typewriter character spans synchronously from the source text.
      var fullText = captionEl.textContent;
      captionEl.textContent = "";
      var charSpans = [];
      for (var i = 0; i < fullText.length; i++) {
        var ch = fullText.charAt(i);
        var span = document.createElement("span");
        span.textContent = ch === " " ? " " : ch;
        captionEl.appendChild(span);
        charSpans.push(span);
      }

      var wordHovesh = scope.getElementById
        ? scope.getElementById("hf03-word-hovesh")
        : document.getElementById("hf03-word-hovesh");
      var wordPlus = scope.getElementById
        ? scope.getElementById("hf03-word-plus")
        : document.getElementById("hf03-word-plus");
      var deviceGroup = scope.getElementById
        ? scope.getElementById("hf03-device-group")
        : document.getElementById("hf03-device-group");

      gsap.set(wordHovesh, { opacity: 0, scale: 1.35, y: 26 });
      gsap.set(wordPlus, { opacity: 0, scale: 1.35, x: -24 });
      gsap.set(deviceGroup, { opacity: 0, y: 420 });
      gsap.set(charSpans, { opacity: 0 });

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-1.5s): "חובש" slams in, upper-third, bold, dark register.
      tl.to(
        wordHovesh,
        { opacity: 1, scale: 1, y: 0, duration: 0.46, ease: "back.out(2.4)" },
        0.05
      );

      // Scene 2 (1.5-3.2s): "פלוס" lands in fire-orange, completing the wordmark;
      // simultaneously the real captured app screen rises from below into a phone mask.
      tl.to(
        wordPlus,
        { opacity: 1, scale: 1, x: 0, duration: 0.46, ease: "back.out(2.4)" },
        1.5
      );
      tl.to(
        deviceGroup,
        { opacity: 1, y: 0, duration: 0.95, ease: "power3.out" },
        1.55
      );

      // Scene 3 (3.2-5.0s): caption types on, held read to the end of the shot.
      tl.to(
        charSpans,
        { opacity: 1, duration: 0.05, stagger: 0.045, ease: "none" },
        3.2
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["03-product-intro"] = tl;
    })();
  </script>
