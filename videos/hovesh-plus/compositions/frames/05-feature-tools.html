  <script>
    (function buildFtoolsTimeline() {
      // This script executes once per template instantiation (cloned by the HyperFrames runtime).
      var scope = document.querySelector('#root[data-composition-id="05-feature-tools"]');
      if (!scope) return;

      var rule = scope.querySelector('[data-ftools-rule]');
      var items = scope.querySelectorAll('[data-ftools-item]');
      var closeLine = scope.querySelector('.ftools-close');
      var closeText = scope.querySelector('.ftools-close-text');

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines['05-feature-tools'] = tl;

      // accent rule stub settles in first, grounding the list — visible well before 0.5s
      tl.fromTo(rule, { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.35, ease: 'power2.out', transformOrigin: 'right center' }, 0.0);

      function revealItem(el, startTime, dur) {
        var marker = el.querySelector('.ftools-marker');
        var mask = el.querySelector('.ftools-label-mask');
        var row = el;

        tl.fromTo(row, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: dur, ease: 'power2.out' }, startTime);
        tl.fromTo(marker, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: 'back.out(2.4)' }, startTime + 0.05);
        tl.fromTo(mask, { clipPath: 'inset(0% 0% 0% 100%)' }, { clipPath: 'inset(0% 0% 0% 0%)', duration: dur, ease: 'power2.out' }, startTime + 0.08);
      }

      // Scene 1 (0.0–1.5s): item 1 pops into slot 1, top of frame
      revealItem(items[0], 0.08, 0.55);

      // Scene 2 (1.5–3.0s): item 2 pops into slot 2 beneath it
      revealItem(items[1], 1.55, 0.55);

      // Scene 3 (3.0–4.3s): item 3 pops into slot 3, completing the list
      revealItem(items[2], 3.05, 0.5);

      // Scene 4 (4.3–5.0s): closing line lands below the completed list, held read
      tl.fromTo(closeLine, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power1.out' }, 4.35);
      tl.fromTo(closeText, { y: 14, scale: 0.98 }, { y: 0, scale: 1, duration: 0.4, ease: 'power2.out' }, 4.35);

      tl.to({}, { duration: 0.01 }, 5.0);
    })();
  </script>
