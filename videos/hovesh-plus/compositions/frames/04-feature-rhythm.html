<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "HF-Barlow";
          src: local("Arial Hebrew"), local("Arial"), local("Segoe UI"), local("Tahoma");
          font-weight: 400 900;
        }
        @font-face {
          font-family: "HF-Mono";
          src: local("Courier New"), local("Consolas"), local("Arial");
          font-weight: 400 700;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          font-family: "HF-Barlow", "Arial Hebrew", Arial, sans-serif;
          direction: rtl;
        }

        .fr4-bg {
          position: absolute;
          inset: 0;
          background: #71717a;
        }

        .fr4-scene {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }

        .fr4-camera {
          position: absolute;
          inset: 0;
          display: block;
          transform-origin: 50% 50%;
          will-change: transform;
        }

        .fr4-kicker {
          position: absolute;
          top: 300px;
          left: 60px;
          right: 60px;
          text-align: center;
          font-family: "HF-Mono", monospace;
          font-size: 22px;
          font-weight: 500;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #22c55e;
          opacity: 0.9;
        }

        .fr4-grid {
          position: absolute;
          top: 380px;
          left: 60px;
          width: 960px;
          height: 640px;
          display: grid;
          grid-template-columns: 460px 460px;
          grid-template-rows: 300px 300px;
          gap: 40px;
        }

        .fr4-card {
          position: relative;
          border: 1px solid rgba(17, 17, 20, 0.35);
          background: rgba(17, 17, 20, 0.14);
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
          padding: 28px 32px;
          will-change: transform, opacity, border-color;
        }

        .fr4-card-num {
          position: absolute;
          top: 20px;
          right: 24px;
          font-family: "HF-Mono", monospace;
          font-size: 18px;
          font-weight: 500;
          letter-spacing: 0.14em;
          color: rgba(17, 17, 20, 0.55);
        }

        .fr4-card-rule {
          width: 36px;
          height: 2px;
          background: #22c55e;
          margin-bottom: 18px;
        }

        .fr4-card-label {
          font-family: "HF-Barlow", "Arial Hebrew", Arial, sans-serif;
          font-weight: 700;
          font-size: 52px;
          line-height: 1.1;
          letter-spacing: -0.02em;
          color: #111114;
          text-transform: lowercase;
        }

        .fr4-closing {
          position: absolute;
          top: 1180px;
          left: 60px;
          width: 960px;
          text-align: center;
        }

        .fr4-closing p {
          margin: 0;
          font-family: "HF-Barlow", "Arial Hebrew", Arial, sans-serif;
          font-weight: 700;
          font-size: 58px;
          line-height: 1.25;
          letter-spacing: -0.01em;
          color: #111114;
        }
      </style>

      <div id="root" data-composition-id="04-feature-rhythm" data-width="1080" data-height="1920">
        <div class="fr4-bg clip" data-start="0" data-duration="5" data-track-index="0"></div>

        <div class="fr4-scene clip" data-start="0" data-duration="5" data-track-index="1">
          <div class="fr4-camera" id="fr4-camera">
            <div class="fr4-kicker" id="fr4-kicker">כלי המפתח</div>

            <div class="fr4-grid">
              <div class="fr4-card" id="fr4-card-1" data-slot="tl">
                <div class="fr4-card-num">01</div>
                <div class="fr4-card-rule"></div>
                <div class="fr4-card-label" dir="rtl">מטרונום<br />החייאה</div>
              </div>
              <div class="fr4-card" id="fr4-card-2" data-slot="tr">
                <div class="fr4-card-num">02</div>
                <div class="fr4-card-rule"></div>
                <div class="fr4-card-label" dir="rtl">דופק</div>
              </div>
              <div class="fr4-card" id="fr4-card-3" data-slot="bl">
                <div class="fr4-card-num">03</div>
                <div class="fr4-card-rule"></div>
                <div class="fr4-card-label" dir="rtl">נשימות</div>
              </div>
              <div class="fr4-card" id="fr4-card-4" data-slot="br">
                <div class="fr4-card-num">04</div>
                <div class="fr4-card-rule"></div>
                <div class="fr4-card-label" dir="rtl">מד<br />BPM</div>
              </div>
            </div>

            <div class="fr4-closing" id="fr4-closing">
              <p dir="rtl">הקצב הנכון, בלחיצה אחת.</p>
            </div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });

          var LIT_BORDER = "#22c55e";
          var DIM_BORDER = "rgba(17, 17, 20, 0.35)";

          // ---- kicker: quiet settle before the first card ----
          tl.fromTo(
            "#fr4-kicker",
            { opacity: 0, y: 10 },
            { opacity: 0.9, y: 0, duration: 0.4, ease: "power3.out" },
            0.0
          );

          // ---- closing line: hidden until Scene 4 ----
          gsap.set("#fr4-closing p", { opacity: 0, y: 22 });

          // Card pop-entrance helper (spring-pop-entrance: smooth power3.out settle,
          // scale 0 -> 1 with a small y rise, no bounce) + border ignite to fire-orange
          // (accent border "lights up" as the card lands).
          function popCard(id, at) {
            var sel = "#" + id;
            tl.fromTo(
              sel,
              { scale: 0, opacity: 0, y: 24, borderColor: DIM_BORDER },
              { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
              at
            );
            tl.to(
              sel,
              { borderColor: LIT_BORDER, duration: 0.35, ease: "power2.out" },
              at + 0.3
            );
          }

          gsap.set(["#fr4-card-1", "#fr4-card-2", "#fr4-card-3", "#fr4-card-4"], {
            transformOrigin: "50% 50%",
          });

          // Scene 1 (0.0-1.2s): "מטרונום החייאה" -> upper-left card
          popCard("fr4-card-1", 0.15);

          // Scene 2 (1.2-2.4s): "דופק" -> upper-right card
          popCard("fr4-card-2", 1.3);

          // Scene 3 (2.4-3.6s): "נשימות" (lower-left) then "מד BPM" (lower-right)
          // almost simultaneously, completing the 2x2 grid.
          popCard("fr4-card-3", 2.5);
          popCard("fr4-card-4", 2.58);

          // Scene 4 (3.6-5.0s): closing line lands beneath the completed, held grid.
          tl.fromTo(
            "#fr4-closing p",
            { opacity: 0, y: 22 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            3.75
          );

          // Blueprint's "near-static hold with slow push-in": once the grid is
          // complete, the whole camera creeps forward gently for the remainder
          // of the shot (multi-phase-camera, steady-push pattern, subtle scale
          // only -- no drift needed at this short duration).
          tl.to(
            "#fr4-camera",
            { scale: 1.025, duration: 2.0, ease: "power1.out" },
            3.0
          );

          window.__timelines["04-feature-rhythm"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
