    <style>
      @font-face {

        font-weight: 100 900;

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #09090b; }
      #root {
        position: relative; width: 1080px; height: 1920px; overflow: hidden;
        background: #09090b; font-family: "Heebo", Arial, sans-serif; color: #f4f4f5; direction: rtl;
      }
      .clip { position: absolute; inset: 0; }
      video.clip { width: 1080px; height: 1920px; object-fit: cover; }

      /* bottom scrim so captions read over footage */
      #scrim {
        background: linear-gradient(to top, rgba(9, 9, 11, 0.92) 0%, rgba(9, 9, 11, 0.55) 22%, rgba(9, 9, 11, 0) 42%);
      }

      /* captions */
      .cap {
        position: absolute; left: 70px; right: 70px; bottom: 300px;
        text-align: center; font-weight: 900; font-size: 96px; line-height: 1.05;
        letter-spacing: -0.01em; text-shadow: 0 6px 30px rgba(0, 0, 0, 0.55);
      }
      .cap .acc { color: #ef233c; }
      .cap .grn { color: #22c55e; }
      .kicker {
        position: absolute; left: 0; right: 0; bottom: 560px; text-align: center;
        font-weight: 700; font-size: 38px; letter-spacing: 0.08em; color: #a1a1aa;
      }

      /* real-screen insert: phone mockup on dark ground */
      .insert { background: radial-gradient(circle at 50% 38%, rgba(239, 35, 60, 0.18), rgba(9, 9, 11, 0) 60%), #09090b; }
      .phone {
        position: absolute; left: 50%; top: 150px; width: 640px; height: 1385px; margin-left: -320px;
        border-radius: 86px; border: 14px solid #27272a; background: #000; overflow: hidden;
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6), 0 0 0 2px #3f3f46;
      }
      .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
      .insert .cap { bottom: 170px; font-size: 92px; }

      /* end card */
      #end { background: radial-gradient(circle at 50% 42%, rgba(239, 35, 60, 0.22), rgba(9, 9, 11, 0) 58%), #09090b; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #end-icon { width: 300px; height: 300px; filter: drop-shadow(0 30px 60px rgba(239, 35, 60, 0.35)); }
      .wordmark { margin-top: 56px; font-weight: 900; font-size: 200px; line-height: 1; display: flex; gap: 10px; }
      .wordmark .plus { color: #ef233c; }
      #end-free { margin-top: 36px; font-weight: 900; font-size: 84px; color: #22c55e; }
      #end-tag { margin-top: 18px; font-weight: 700; font-size: 66px; color: #d4d4d8; }
      #end-tag b { color: #ef233c; font-weight: 900; }
      #end-pill { margin-top: 80px; padding: 26px 70px; border-radius: 100px; background: #ef233c; font-weight: 800; font-size: 54px; color: #fff; }

      #flash { background: #fff; opacity: 0; }

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // captions: rise in, fade out just before their clip ends

        tl.to(id, { opacity: 0, duration: 0.2, ease: "power2.in" }, b - 0.22);
      });

      // footage: gentle push-in on every shot
      [["#v0", 0, 3.1], ["#v1", 3.1, 3.9], ["#v2", 9.0, 3.6], ["#v3", 15.1, 5.1], ["#v4", 21.2, 4.2], ["#v5", 25.4, 4.9]].forEach(([id, a, d]) => {
