<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Heebo";
        src: url("assets/Heebo.ttf") format("truetype");
        font-weight: 100 900;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #09090b; }
      #root {
        position: relative; width: 1080px; height: 1920px; overflow: hidden;
        background: #09090b; font-family: "Heebo", Arial, sans-serif; color: #f4f4f5; direction: rtl;
      }
      .clip { position: absolute; inset: 0; }
      video.clip { width: 1080px; height: 1920px; object-fit: cover; }

      /* bottom scrim so captions read over footage */
      #scrim {
        background: linear-gradient(to top, rgba(9, 9, 11, 0.92) 0%, rgba(9, 9, 11, 0.55) 22%, rgba(9, 9, 11, 0) 42%);
      }

      /* captions */
      .cap {
        position: absolute; left: 70px; right: 70px; bottom: 300px;
        text-align: center; font-weight: 900; font-size: 96px; line-height: 1.05;
        letter-spacing: -0.01em; text-shadow: 0 6px 30px rgba(0, 0, 0, 0.55);
      }
      .cap .acc { color: #ef233c; }
      .cap .grn { color: #22c55e; }
      .kicker {
        position: absolute; left: 0; right: 0; bottom: 560px; text-align: center;
        font-weight: 700; font-size: 38px; letter-spacing: 0.08em; color: #a1a1aa;
      }

      /* real-screen insert: phone mockup on dark ground */
      .insert { background: radial-gradient(circle at 50% 38%, rgba(239, 35, 60, 0.18), rgba(9, 9, 11, 0) 60%), #09090b; }
      .phone {
        position: absolute; left: 50%; top: 150px; width: 640px; height: 1385px; margin-left: -320px;
        border-radius: 86px; border: 14px solid #27272a; background: #000; overflow: hidden;
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6), 0 0 0 2px #3f3f46;
      }
      .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
      .insert .cap { bottom: 170px; font-size: 92px; }

      /* end card */
      #end { background: radial-gradient(circle at 50% 42%, rgba(239, 35, 60, 0.22), rgba(9, 9, 11, 0) 58%), #09090b; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #end-icon { width: 300px; height: 300px; filter: drop-shadow(0 30px 60px rgba(239, 35, 60, 0.35)); }
      .wordmark { margin-top: 56px; font-weight: 900; font-size: 200px; line-height: 1; display: flex; gap: 10px; }
      .wordmark .plus { color: #ef233c; }
      #end-free { margin-top: 36px; font-weight: 900; font-size: 84px; color: #22c55e; }
      #end-tag { margin-top: 18px; font-weight: 700; font-size: 66px; color: #d4d4d8; }
      #end-tag b { color: #ef233c; font-weight: 900; }
      #end-pill { margin-top: 80px; padding: 26px 70px; border-radius: 100px; background: #ef233c; font-weight: 800; font-size: 54px; color: #fff; }

      #flash { background: #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="35" data-width="1080" data-height="1920">
      <!-- footage (Higgsfield shots with the real app composited onto the phone screens) -->
      <video id="v0" class="clip" src="assets/comp/s0.mp4" data-start="0" data-duration="3.4" data-media-start="0.3" data-track-index="0" muted playsinline></video>
      <video id="v1" class="clip" src="assets/comp/s1.mp4" data-start="3.4" data-duration="3.9" data-media-start="0.6" data-track-index="0" muted playsinline></video>
      <div id="i1" class="clip insert" data-start="7.3" data-duration="2.1" data-track-index="0">
        <div class="phone" id="i1-phone"><img src="assets/screens/06-meds-result.png" alt="" /></div>
      </div>
      <video id="v2" class="clip" src="assets/comp/s2.mp4" data-start="9.4" data-duration="3.6" data-media-start="1.4" data-track-index="0" muted playsinline></video>
      <div id="i2" class="clip insert" data-start="13" data-duration="2.2" data-track-index="0">
        <div class="phone" id="i2-phone"><img src="assets/screens/04-bridge-list.png" alt="" /></div>
      </div>
      <video id="v3" class="clip" src="assets/comp/s3.mp4" data-start="15.2" data-duration="5" data-media-start="0" data-track-index="0" muted playsinline></video>
      <div id="i3" class="clip insert" data-start="20.2" data-duration="1.2" data-track-index="0">
        <div class="phone" id="i3-phone"><img src="assets/screens/02-metronome-a.png" alt="" /></div>
      </div>
      <video id="v4" class="clip" src="assets/comp/s4.mp4" data-start="21.4" data-duration="4.8" data-media-start="0.2" data-track-index="0" muted playsinline></video>
      <video id="v5" class="clip" src="assets/comp/s5.mp4" data-start="26.2" data-duration="4.8" data-media-start="0.2" data-track-index="0" muted playsinline></video>
      <div id="end" class="clip" data-start="31" data-duration="4" data-track-index="0">
        <img id="end-icon" src="assets/icon.svg" alt="" />
        <div class="wordmark" id="end-word"><span>חובש</span><span class="plus">+</span></div>
        <div id="end-free">חינם. תמיד.</div>
        <div id="end-tag">כי <b>כל שנייה</b> קובעת</div>
        <div id="end-pill">הוסיפו למסך הבית</div>
      </div>

      <div id="scrim" class="clip" data-start="0" data-duration="31" data-track-index="1"></div>
      <div id="flash" class="clip" data-start="15.1" data-duration="0.4" data-track-index="3"></div>

      <!-- captions -->
      <div id="c0" class="clip" data-start="0.5" data-duration="2.8" data-track-index="2"><div class="cap">משמרת אחת.<br /><span class="acc">אינסוף מצבים.</span></div></div>
      <div id="c1" class="clip" data-start="3.7" data-duration="3.5" data-track-index="2"><div class="kicker">סורק תרופות</div><div class="cap">צלם. <span class="grn">דע מה הוא לוקח.</span></div></div>
      <div id="c1b" class="clip" data-start="7.4" data-duration="1.9" data-track-index="2"><div class="insert-cap cap" style="bottom:170px;font-size:92px">שם, מינון, התוויות.</div></div>
      <div id="c2" class="clip" data-start="9.7" data-duration="3.2" data-track-index="2"><div class="kicker">גשר שפה</div><div class="cap">לא מדברת עברית?</div></div>
      <div id="c2b" class="clip" data-start="13.1" data-duration="2" data-track-index="2"><div class="cap" style="bottom:170px;font-size:92px">מתנדב בשפה שלה. <span class="grn">עכשיו.</span></div></div>
      <div id="c3" class="clip" data-start="15.5" data-duration="4.6" data-track-index="2"><div class="kicker" style="bottom:auto;top:180px">מטרונום החייאה</div><div class="cap" style="bottom:auto;top:280px">הקצב <span class="acc">בידיים שלך.</span></div></div>
      <div id="c4" class="clip" data-start="21.6" data-duration="4.5" data-track-index="2"><div class="kicker">ספירת דופק</div><div class="cap"><span class="grn">88.</span> בלי חישובים.</div></div>
      <div id="c5" class="clip" data-start="26.4" data-duration="4.5" data-track-index="2"><div class="kicker">בתי חולים קרובים</div><div class="cap">המיון הקרוב. <span class="acc">עכשיו.</span></div></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // captions: rise in, fade out just before their clip ends
      const caps = [
        ["#c0", 0.5, 3.3], ["#c1", 3.7, 7.2], ["#c1b", 7.4, 9.3], ["#c2", 9.7, 12.9],
        ["#c2b", 13.1, 15.1], ["#c3", 15.5, 20.1], ["#c4", 21.6, 26.1], ["#c5", 26.4, 30.9],
      ];
      caps.forEach(([id, a, b]) => {
        tl.fromTo(id + " .cap", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, a);
        if (document.querySelector(id + " .kicker")) tl.fromTo(id + " .kicker", { opacity: 0 }, { opacity: 1, duration: 0.3 }, a);
        tl.to(id, { opacity: 0, duration: 0.2, ease: "power2.in" }, b - 0.22);
      });

      // footage: gentle push-in on every shot
      [["#v0", 0, 3.4], ["#v1", 3.4, 3.9], ["#v2", 9.4, 3.6], ["#v3", 15.2, 5], ["#v4", 21.4, 4.8], ["#v5", 26.2, 4.8]].forEach(([id, a, d]) => {
        tl.fromTo(id, { scale: 1.0 }, { scale: 1.07, duration: d, ease: "none" }, a);
      });

      // real-screen inserts: phone slides up, screen content scrolls a touch
      [["#i1-phone", 7.3], ["#i2-phone", 13], ["#i3-phone", 20.2]].forEach(([id, a]) => {
        tl.fromTo(id, { y: 500, scale: 0.9, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, a);
      });
      tl.fromTo("#i1-phone img", { objectPosition: "50% 0%" }, { objectPosition: "50% 45%", duration: 1.5, ease: "power1.inOut" }, 7.7);
      tl.fromTo("#i3-phone", { scale: 1 }, { scale: 1.04, duration: 0.27, yoyo: true, repeat: 3, ease: "sine.inOut" }, 20.6);

      // CPR entrance flash
      tl.fromTo("#flash", { opacity: 0.0 }, { opacity: 0.7, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out" }, 15.15);

      // end card
      tl.fromTo("#end-icon", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(1.8)" }, 31.05);
      tl.fromTo("#end-word", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 31.2);
      tl.fromTo("#end-free", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.2)" }, 31.8);
      tl.fromTo("#end-tag", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 32.6);
      tl.fromTo("#end-pill", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 33.2);

      tl.to({}, { duration: 35 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
